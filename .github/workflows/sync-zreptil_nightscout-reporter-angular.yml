name: sync zreptil/nightscout-reporter-angular

on:
  schedule:
    # Run weekly on Saturday at 00:00:00 UTC
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/zreptil/nightscout-reporter-angular.git

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream master branch
        run: |
          git merge upstream/master -m "Sync: upstream changes from $(date)" || true

      - name: Push to origin master
        run: |
          git push origin master || true
